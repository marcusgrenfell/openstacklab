---
# tasks file for initial-openstack-config
#- name: Install Base packages
#  ansible.builtin.apt:
#    pkg: 'python3-pip'

#- name: Install ansible
#  ansible.builtin.pip:
#    name: 'python-openstackclient'
#    break_system_packages: true
- name: Check whether OS image exists
  register: osimage
  stat:
    path: "{{ cirros_image }}"

- name: Download OS image
  ansible.builtin.get_url:
    url: "{{ cirros_image }}"
    dest: /root
  when: osimage.stat.exists == false

- name: Import OS image
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack image create --file /root/cirros-0.6.3-x86_64-disk.img --disk-format qcow2 --min-disk 4 ubuntu-image"
    executable: /bin/bash

- name: Create external network
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack network create --share --project admin --external --provider-network-type flat --provider-physical-network physnet1 external"
    executable: /bin/bash

- name: Create external subnet
  ansible.builtin.shell:
    #cmd: "source /etc/kolla/admin-openrc.sh && openstack subnet create --network external --subnet-range 200.200.200.0/24 --project admin --no-dhcp --gateway 200.200.200.1 --allocation-pool start=200.200.200.60,end=200.200.200.100 external"
    cmd: "source /etc/kolla/admin-openrc.sh && openstack subnet create --network external --subnet-range 200.200.200.0/24 --project admin --gateway 200.200.200.1 --allocation-pool start=200.200.200.60,end=200.200.200.100 external"
    executable: /bin/bash

- name: Create internal network
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack network create internal"
    executable: /bin/bash

- name: Create internal subnet
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack subnet create --network internal --subnet-range 192.168.10.0/24 --dns-nameserver 8.8.8.8 internal"
    executable: /bin/bash

- name: Create router
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack router create --project admin --external-gateway external --fixed-ip subnet=external,ip-address=200.200.200.70 --enable-snat router-external"
    executable: /bin/bash

- name: Add internal network to router
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack router add subnet router-external internal"
    executable: /bin/bash

- name: Add icmp rule to default SG
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack security group rule create --protocol icmp --ingress default"
    executable: /bin/bash
    
- name: Add ssh rule to default SG
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack security group rule create --dst-port 22 --protocol tcp --ingress default"
    executable: /bin/bash

- name: Create flavor
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack flavor create --public --ram 160 --disk 4 m2.mini"
    executable: /bin/bash

- name: Create volume for server 1
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack volume create --size 4 --image ubuntu-image --bootable server1"
    executable: /bin/bash

- name: Create server1 
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack server create --flavor m2.mini --volume server1 --network internal server1"
    executable: /bin/bash

- name: Create volume for server 2
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack volume create --size 4 --image ubuntu-image --bootable server2"
    executable: /bin/bash

- name: Create server2 
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack server create --flavor m2.mini --volume server2 --network internal server2"
    executable: /bin/bash

- name: Create float ip to server 1
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack floating ip create --floating-ip-address 200.200.200.91 external"
    executable: /bin/bash
    
- name: add float ip to server 1
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack server add floating ip server1 200.200.200.91"
    executable: /bin/bash
    
- name: Create float ip to server 2
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack floating ip create --floating-ip-address 200.200.200.92 external"
    executable: /bin/bash
    
- name: add float ip to server 2
  ansible.builtin.shell:
    cmd: "source /etc/kolla/admin-openrc.sh && openstack server add floating ip server2 200.200.200.92"
    executable: /bin/bash

- debug: msg="Login url https://{{ kolla_internal_address }}"
  when: kolla_ssl is defined and kolla_ssl == 'yes'

- debug: msg="Login url http://{{ kolla_internal_address }}"
  when: kolla_ssl is not defined or kolla_ssl == 'no'